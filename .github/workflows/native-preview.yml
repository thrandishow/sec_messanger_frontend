name: Build native preview
on:
  push:
    branches: ['release-build/**']
permissions:
  contents: read
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x64, runner: windows-latest}
          - {platform: macos, runner: macos-26}
          - {platform: ios-device, runner: macos-26}
          - {platform: ios-simulator, runner: macos-26}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Build and package Windows
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = 'build/windows/x64/runner/Release'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $runtime = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (!$runtime) { throw 'Missing Visual C++ runtime' }
          Copy-Item "$($runtime.FullName)/*.dll" $bundle -Force
          foreach ($file in @('shifr_client.exe', 'flutter_windows.dll', 'data/app.so', 'data/icudtl.dat')) {
            if (!(Test-Path "$bundle/$file")) { throw "Missing $file" }
          }
          $process = Start-Process -FilePath "$bundle/shifr_client.exe" -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) { throw "Client exited with $($process.ExitCode)" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath dist/shifr-windows-x64.zip
      - name: Build and package macOS
        if: matrix.platform == 'macos'
        run: |
          set -eu
          flutter build macos --release --no-pub
          app=build/macos/Build/Products/Release/shifr_client.app
          exe="$app/Contents/MacOS/shifr_client"
          codesign --verify --deep --strict "$app"
          lipo -archs "$exe"
          "$exe" & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$pid"
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/shifr-macos.zip
      - name: Build and package iOS device application for signing
        if: matrix.platform == 'ios-device'
        run: |
          set -eu
          flutter build ios --release --no-codesign --no-pub
          app=build/ios/iphoneos/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          lipo -verify_arch arm64 "$app/Runner"
          mkdir -p build/ios/ipa/Payload dist
          ditto "$app" build/ios/ipa/Payload/Runner.app
          ditto -c -k --norsrc --keepParent build/ios/ipa/Payload dist/shifr-ios-unsigned.ipa
      - name: Build and launch in iOS Simulator
        if: matrix.platform == 'ios-simulator'
        run: |
          set -eu
          flutter build ios --simulator --debug --no-pub
          app=build/ios/iphonesimulator/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneSimulator
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for r,ds in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in ds if "iPhone" in d["name"]))')
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" ru.shifrsvyaz.shifrClient
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/shifr-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shifr-${{ matrix.platform }}
          path: native/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
