[package]
name = "shifr-windows"
version = "0.1.0"
edition = "2024"
publish = false
description = "Лёгкий клиент Шифр-связи для Windows"

[dependencies]
anyhow = "1"
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["notice", "file-dialog", "listbox", "textbox", "combobox", "high-dpi"] }
native-windows-derive = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
